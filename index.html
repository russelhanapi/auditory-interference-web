<!doctype html>
<html lang="en" data-theme="dark" data-astryx-theme="neutral">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B0B0C" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23a6a6a0'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23a6a6a0'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Enter your access sequence to open the private Auditory Interference playlist."
    />
    <title>AUDITORY INTERFERENCE</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0b0b0c;
      }
      .boot-title {
        --disc: max(min(165vw, 96svh), 460px);
        position: fixed;
        top: calc(50% - var(--disc) / 2 + var(--disc) * 0.2);
        left: 50%;
        box-sizing: border-box;
        max-width: calc(100vw - 48px);
        margin: 0;
        padding: 6px 6px 6px 10px;
        color: #a6a6a0;
        font: 500 12px/1.4 sans-serif;
        letter-spacing: 0.34em;
        text-align: center;
        white-space: nowrap;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-title" aria-hidden="true">AUDITORY INTERFERENCE</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
